<!DOCTYPE html>

<head>

<title>Flowsense – Full Wiring Diagram</title>
<style>
  @page { size: A3 landscape; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e8eaed; width: 100%; }
  .print-btn {
    position: fixed; top: 14px; right: 14px;
    padding: 10px 22px; background: #1d4ed8; color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 600; font-family: Arial, sans-serif;
    z-index: 999; box-shadow: 0 2px 12px rgba(0,0,0,.3);
    letter-spacing: .3px;
  }
  .print-btn:hover { background: #1e40af; }
  @media print {
    html, body { background: white; }
    .print-btn { display: none; }
    svg { width: 100vw !important; height: auto !important; }
  }
  svg { display: block; margin: 0 auto; max-width: 100%; }
</style>
</head>
<body>
<button class="print-btn" onclick="window.print()">🖨  Print / Save as PDF</button>

  <text x="255" y="685" font-size="8" fill="#4b5563">• Add inline fuse (500mA) on Live wire</text>
